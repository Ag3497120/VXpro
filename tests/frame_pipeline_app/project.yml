name: VXFramePipeline
options:
  deploymentTarget:
    visionOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Frame Pipeline Test"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VXFramePipeline:
    type: application
    platform: visionOS
    sources:
      - path: ../frame_pipeline_bench.m
      - path: ../frame_pipeline_bench.h
      - path: ../frame_pipeline_app.swift
      - path: ../../vr/frame_pipeline.c
      - path: ../../vr/frame_pipeline.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VXFramePipeline
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) VX_FRAME_PIPELINE_APP=1"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../../tests/frame_pipeline_bench.h"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
