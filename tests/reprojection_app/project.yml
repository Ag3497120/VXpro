name: VXReprojectionTest
options:
  deploymentTarget:
    visionOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Reprojection Test"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_NSWorldSensingUsageDescription: "格子と球を空間に固定し、頭の動きに対する表示補正を比較します。"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.VXReprojectionTest
targets:
  VXReprojectionTest:
    type: application
    platform: visionOS
    sources:
      - path: Sources
    dependencies:
      - sdk: ARKit.framework
      - sdk: CompositorServices.framework
      - sdk: Metal.framework
      - sdk: CoreText.framework
